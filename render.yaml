services:
  - type: web
    name: hostelos
    runtime: python
    plan: free
    region: oregon
    buildCommand: "bash build.sh"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NODE_VERSION
        value: 20

